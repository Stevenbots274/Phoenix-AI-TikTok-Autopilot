services:
  - type: web
    name: phoenix-ai-tiktok-autopilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/health
    envVars:
      - key: PHOENIX_HOST
        value: 0.0.0.0
      - key: PHOENIX_PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://whynicscergmbamykgah.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: phoenix-media
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://tiktok.senseiphoenix.name.ng
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: https://tiktok.senseiphoenix.name.ng/api/tiktok/oauth/callback
      - key: TIKTOK_SCOPES
        value: user.info.basic,video.publish
      - key: SMTP_HOST
        value: smtp.zoho.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        value: tiktok@senseiphoenix.name.ng
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: no-reply-tiktok@senseiphoenix.name.ng
      - key: SMTP_FROM_NAME
        value: Phoenix Autopilot
      - key: SUPPORT_EMAIL
        value: support.tiktok@senseiphoenix.name.ng
      - key: PRIVACY_EMAIL
        value: privacy.tiktok@senseiphoenix.name.ng
      - key: PHOENIX_AI_ENDPOINT
        value: https://combined-alidia-suhailtechlnfo-01b0509f.koyeb.app
      - key: PHOENIX_AI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
